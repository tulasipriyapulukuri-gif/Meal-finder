<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
    <!-- HEADER -->
    <header class="nav">
        <h2 id="homeLink" class="logo"><i class="fa-solid fa-utensils" style="color: white;"></i>
            MEAL FINDER</h2>

        <div id="hamburger" class="hamburger">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </header>

    <!-- SEARCH + TITLE -->
    <div class="hero">
        <input type="text" id="searchInput" placeholder="          Search recipes here..."/>
        <h1>What are your favorite cuisines?</h1>
        <p>PERSONALIZE YOUR EXPERIENCE </p>
    </div>

    <!-- =========== SECTIONS =========== -->

    <!-- HOME: CATEGORIES -->
    <section id="page-categories">
        <h2 class="title">CATEGORIES</h2>
        <div id="categories" class="categories"></div>
    </section>

    <!-- CATEGORY RESULTS -->
    <section id="page-meals" style="display:none;">
        <h2 id="mealCategoryTitle" class="title"></h2>
        <div id="mealList"></div>
    </section>

    <!-- MEAL DETAILS -->
    <section id="page-details" style="display:none;">
        <div id="mealDetails"></div>
    </section>

    <!-- SEARCH RESULTS -->
    <section>
        <h2 class="title"></h2>
        <div id="results"></div>
    </section>

    <script src="app.js"></script>
</body>

</html>
